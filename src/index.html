<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; script-src 'self'">
  <title>Pocket-Mapp-Creator</title>
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- ============ TOP BAR ============ -->
  <header id="topbar">
    <div class="brand" title="Pocket-Mapp-Creator"><img class="logo" src="icon.png" alt=""><span class="brand-name">Pocket-Mapp-Creator</span></div>
    <div class="group">
      <button data-cmd="new" title="New map (Ctrl+N)">New</button>
      <button data-cmd="open" title="Open map (Ctrl+O)">Open</button>
      <button data-cmd="save" title="Save map (Ctrl+S)">Save</button>
    </div>
    <button id="backBtn" class="hidden" data-cmd="back">◀</button>
    <div class="group">
      <button data-cmd="undo" title="Undo (Ctrl+Z)">↶</button>
      <button data-cmd="redo" title="Redo (Ctrl+Y)">↷</button>
    </div>
    <div class="group">
      <label>Style
        <select id="styleSelect">
          <option value="parchment">Parchment</option>
          <option value="colour">Full colour</option>
          <option value="watercolour">Watercolour</option>
          <option value="copperplate">Copperplate</option>
          <option value="night">Night &amp; Gold</option>
        </select>
      </label>
      <button data-cmd="resize" title="Change map size">Map size…</button>
      <label class="chk"><input type="checkbox" id="gridToggle"> Grid</label>
      <label class="chk" title="Snap rooms to grid lines and assets to the middle of squares"><input type="checkbox" id="snapToggle"> Snap</label>
      <label class="chk"><input type="checkbox" id="borderToggle" checked> Border</label>
    </div>
    <div class="spacer"></div>
    <div class="group">
      <button class="zbtn" data-cmd="zoomOut" title="Zoom out (Ctrl+-)">−</button>
      <input id="zoomInput" type="text" value="100%" title="Type a zoom level and press Enter">
      <button class="zbtn" data-cmd="zoomIn" title="Zoom in (Ctrl+=)">+</button>
      <select id="zoomPreset" title="Zoom presets">
        <option value="">Zoom…</option>
        <option value="fit">Fit to window</option>
        <option value="25">25%</option><option value="50">50%</option><option value="75">75%</option>
        <option value="100">100% (actual size)</option><option value="150">150%</option>
        <option value="200">200%</option><option value="400">400%</option>
      </select>
      <button data-cmd="zoomFit" title="Fit (Ctrl+0)">Fit</button>
    </div>
    <div class="group">
      <button data-cmd="guide" title="User Guide (F1)">? Guide</button>
    </div>
    <div class="group">
      <button class="primary" data-cmd="exportPng">Export PNG</button>
      <button class="primary" data-cmd="exportJpg">Export JPG</button>
      <button class="primary" data-cmd="exportMore" title="Export SVG or PDF, or print the map">More…</button>
    </div>
  </header>

  <main id="layout">
    <!-- ============ TOOLS ============ -->
    <nav id="tools">
      <button class="tool active" data-tool="select" title="Select / move / rotate / scale (V)"><span>⌖</span>Select</button>
      <button class="tool" data-tool="stamp" title="Place assets (S)"><span>❋</span>Stamp</button>
      <button class="tool" data-tool="land" title="Land brush: paint land in any shape (B)"><span>⬟</span>Land</button>
      <button class="tool" data-tool="ocean" title="Ocean brush: turn land back into sea (E)"><span>≋</span>Ocean</button>
      <button class="tool" data-tool="fill" title="Fill bucket: fill an outline with land, or turn land into water (G)"><span class="svgicon"><svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"><path d="M4.5 11.5 11 5l7.5 7.5-6.5 6.5a2 2 0 0 1-2.8 0L4.5 14.3a2 2 0 0 1 0-2.8z"/><path d="M4.6 12.5h13.5" opacity=".55"/><path d="M8.5 7.5 6 5"/><path d="M20 15.5s-1.6 2-1.6 3.1a1.6 1.6 0 0 0 3.2 0c0-1.1-1.6-3.1-1.6-3.1z" fill="currentColor"/></svg></span>Fill</button>
      <button class="tool" data-tool="texture" title="Texture brush: paint grass, sand, rock, snow, stone, wood, water (X)"><span>▦</span>Texture</button>
      <button class="tool" data-tool="path" title="Paint ground paths, roads, dirt (P)"><span>▒</span>Ground</button>
      <button class="tool" data-tool="line" title="Draw rivers, roads, borders (L)"><span>〰</span>Lines</button>
      <button class="tool" data-tool="shape" title="Shapes: rooms, walls and floor areas (U)"><span>▭</span>Shapes</button>
      <button class="tool" data-tool="dungeon" title="Dungeon: carve rooms and corridors square by square (D)"><span>▚</span>Dungeon</button>
      <button class="tool" data-tool="text" title="Add text labels and a map key (T)"><span>A</span>Text</button>
      <button class="tool" data-tool="measure" title="Measure distances (M)"><span>📏</span>Measure</button>
      <button class="tool" data-tool="pan" title="Pan (H, or hold Space)"><span>✋</span>Pan</button>
    </nav>

    <!-- ============ LIBRARY ============ -->
    <aside id="library">
      <div class="panel-title">Asset library</div>
      <div class="filters">
        <div class="seg" id="genreSeg">
          <button data-genre="fantasy" class="on">Fantasy</button>
          <button data-genre="scifi">Sci-Fi</button>
          <button data-genre="modern">Modern</button>
          <button data-genre="realistic">Realistic</button>
          <button data-genre="all">All</button>
        </div>
        <div class="seg small" id="kindSeg">
          <button data-kind="all" class="on">All</button>
          <button data-kind="world" title="Side-view icons for world & region maps">World</button>
          <button data-kind="town" title="3/4 view buildings for towns, cities, villages">Town 3/4</button>
          <button data-kind="battle" title="Top-down assets for RPG battle maps">Battle</button>
          <button data-kind="decor">Decor</button>
        </div>
        <input id="assetSearch" type="search" placeholder="Search assets…">
      </div>
      <div id="assetGrid"></div>
      <div class="custom-head">
        <span>My imported assets</span>
        <button data-cmd="importAsset" class="mini">+ Import</button>
      </div>
      <div id="customGrid"></div>
    </aside>

    <!-- ============ CANVAS ============ -->
    <section id="stageWrap">
      <canvas id="stage"></canvas>
      <div id="toolOptions"></div>
      <div id="status"></div>
      <div id="toast"></div>
      <div id="hScroll" class="sbar h" title="Scroll left / right"><div class="thumb"></div></div>
      <div id="vScroll" class="sbar v" title="Scroll up / down"><div class="thumb"></div></div>
      <div class="sbar-corner"></div>
    </section>

    <!-- ============ RIGHT PANEL ============ -->
    <aside id="right">
      <div class="panel-title">Layers <span class="muted" style="font-family:var(--ui);font-size:11px">click to make active</span></div>
      <div id="layers"></div>
      <div class="panel-title">Properties</div>
      <div id="props"><p class="muted">Select something on the map to edit it.</p></div>
      <div class="panel-title">Assets used <span id="usedCount" class="badge">0</span></div>
      <div id="usedList"></div>
    </aside>
  </main>

  <!-- ============ DIALOG ============ -->
  <div id="modal" class="hidden"><div class="dialog" id="dialog"></div></div>

  <script src="asset-manifest.js"></script>
  <script src="js/terrain.js"></script>
  <script src="js/textures.js"></script>
  <script src="js/generate.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
